# ============================================================================
#  可选：用 nginx 反代 + 域名 + HTTPS
#  服务仍监听 127.0.0.1:8080，只有 nginx 对外
#
#  安装：
#    cp deploy/nginx-sensor-web.conf /etc/nginx/sites-available/sensor-web
#    ln -s /etc/nginx/sites-available/sensor-web /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#
#  HTTPS 用 certbot 一条命令搞定：
#    apt install certbot python3-certbot-nginx
#    certbot --nginx -d sensor.你的域名.com
# ============================================================================

server {
    listen 80;
    server_name sensor.你的域名.com;      # 换成你的域名；没有域名就写 VPS 公网 IP

    # 页面和接口都是小请求，别让它卡住
    client_max_body_size 1m;
    proxy_read_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/sensor-web.access.log;
    error_log  /var/log/nginx/sensor-web.error.log;
}
