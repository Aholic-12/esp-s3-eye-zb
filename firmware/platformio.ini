; ============================================================
; Week1 传感数据采集与上传 —— 板端固件工程
; 用法：
;   ESP32-S3-EYE：
;       pio run -e esp32s3eye -t upload && pio device monitor -e esp32s3eye
;   ESP-EYE / 通用 ESP32（板上无 IMU，需外接 IMU）：
;       pio run -e esp-eye   -t upload && pio device monitor -e esp-eye
; 说明：同一份源码通吃 6 类 IMU（见 src/main.cpp 顶部注释），
;       开机自动扫描 I2C 并优先选择"带陀螺仪的六轴"芯片。
; ============================================================

[platformio]
default_envs = esp32s3eye

; ---------- ESP32-S3-EYE ----------
[env:esp32s3eye]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 8MB
; ESP32-S3-EYE 是 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_PROFILE_ESP32S3EYE=1
    ; ESP32-S3-EYE 没有 USB 转串口芯片，日志走 USB Serial/JTAG
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- I2C 诊断模式（认不出芯片时用） ----------
; 用法： pio run -e diag -t upload --upload-port COM4
;       然后读串口，它会 dump 每个 I2C 设备的全部寄存器
[env:diag]
extends = env:esp32s3eye
build_flags =
    ${env:esp32s3eye.build_flags}
    -DI2C_DIAG=1

; ---------- WiFi 扫描模式（连不上 WiFi 时用） ----------
; 用法： pio run -e wifiscan -t upload --upload-port COM4
[env:wifiscan]
extends = env:esp32s3eye
build_flags =
    ${env:esp32s3eye.build_flags}
    -DWIFI_SCAN=1

; ---------- ESP-EYE / 通用 ESP32 ----------
[env:esp-eye]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_PROFILE_ESPEYE=1
